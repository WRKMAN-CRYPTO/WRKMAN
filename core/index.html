<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0d">
<title>WRKMAN Core</title>
<style>
:root{color-scheme:dark;--bg:#090b0d;--panel:#101419;--line:#2b3138;--ink:#f4f1e8;--muted:#8f9aa4;--amber:#ffb347;--green:#80d6a3;--red:#ff8073;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
body{min-height:100dvh;background:radial-gradient(circle at 50% -10%,#2a2115 0,#111317 34%,#090b0d 72%)}
.wrap{width:min(760px,100%);min-height:100dvh;margin:auto;padding:calc(16px + var(--safeT)) 14px calc(18px + var(--safeB));display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:12px}.mark{width:50px;height:50px;border:1px solid #76572f;border-radius:14px;display:grid;place-items:center;background:#17120d;box-shadow:inset 0 0 20px #ffb34710,0 8px 30px #0008}.mark svg{width:31px;height:31px}
.kicker{font-size:10px;letter-spacing:.19em;color:var(--amber);font-weight:800}.title{margin:3px 0 0;font:800 21px/1 system-ui,-apple-system,sans-serif;letter-spacing:.11em}.sub{margin-top:6px;font-size:11px;color:var(--muted)}
.status{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:9px;letter-spacing:.08em;color:#aeb7bf;background:#0d1014}.pill.good{border-color:#355846;color:var(--green)}.pill.warn{border-color:#6b512f;color:#ffc56f}
.screen{flex:1;min-height:390px;border:1px solid var(--line);border-radius:18px;background:#0b0e11e8;box-shadow:0 20px 60px #0007;overflow:hidden;display:flex;flex-direction:column}
.bar{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#101419}.bar b{font-size:10px;letter-spacing:.15em}.pulse{display:flex;align-items:center;gap:6px;color:var(--green);font-size:9px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #80d6a399;animation:p 1.7s ease-in-out infinite}@keyframes p{50%{opacity:.3;box-shadow:none}}
#log{flex:1;overflow:auto;padding:13px 12px 18px;overscroll-behavior:contain}.row{margin:0 0 12px;line-height:1.5;font-size:12px;white-space:pre-wrap;word-break:break-word}.row .tag{font-size:9px;font-weight:900;letter-spacing:.11em;margin-right:7px}.me .tag{color:var(--amber)}.wrk .tag{color:var(--green)}.sys .tag{color:#77838e}.bad .tag{color:var(--red)}.muted{color:var(--muted)}.strong{color:#fff;font-weight:800}.row a{color:var(--amber);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.quick button,.send{border:1px solid var(--line);background:#11161b;color:#d9dfe4;border-radius:11px;min-height:42px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.06em}.quick button:active,.send:active{transform:scale(.98);background:#171d23}
.composer{display:grid;grid-template-columns:1fr auto;gap:8px}input{width:100%;min-height:48px;border:1px solid #343b43;border-radius:13px;background:#0d1115;color:#fff;padding:0 13px;font:13px ui-monospace,monospace;outline:none}input:focus{border-color:#8d6937;box-shadow:0 0 0 3px #ffb3470e}.send{padding:0 16px;color:#1b1207;background:var(--amber);border-color:#c6842d}
.foot{font-size:9px;color:#69737c;line-height:1.45;text-align:center;padding:0 8px}
@media(max-width:430px){.quick{grid-template-columns:repeat(2,1fr)}.screen{min-height:360px}.title{font-size:19px}}
</style>
</head>
<body>
<main class="wrap">
<header>
  <div class="mark" aria-label="WRKMAN W">
    <svg viewBox="0 0 64 64" role="img"><path d="M8 14l9 36 15-22 15 22 9-36" fill="none" stroke="#ffb347" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div><div class="kicker">HEARTBEAT / 0.9</div><h1 class="title">WRKMAN CORE</h1><div class="sub">Small. Persistent. Read-only hands. No bluffing.</div></div>
</header>

<div class="status">
  <span class="pill good">CORE ONLINE</span>
  <span class="pill warn" id="brain-pill">BRAIN: NONE</span>
  <span class="pill">MEMORY: LOCAL</span>
  <span class="pill">REPO: READ ONLY</span>
</div>

<section class="screen">
  <div class="bar"><b>WORK LOG</b><span class="pulse"><span class="dot"></span>HEARTBEAT</span></div>
  <div id="log" aria-live="polite"></div>
</section>

<div class="quick">
  <button data-cmd="status">STATUS</button>
  <button data-cmd="capabilities">CAPABILITIES</button>
  <button data-cmd="inspect">INSPECT SELF</button>
  <button data-cmd="memories">MEMORIES</button>
</div>

<form class="composer" id="form">
  <input id="in" autocomplete="off" autocapitalize="sentences" spellcheck="true" placeholder="Tell WRKMAN something…">
  <button class="send" type="submit">SEND</button>
</form>

<div class="foot">Memory lives only in this browser for now. Repository access is public and read-only. Unknown stays unknown.</div>
</main>

<script src="brain.js?v=0.9.0"></script>
<script>
(function(){
'use strict';

var OWNER='WRKMAN-CRYPTO';
var REPO='WRKMAN';
var BRANCH='main';
var API='https://api.github.com/repos/'+OWNER+'/'+REPO;
var READER='https://reader-production-afd3.up.railway.app';
var MEMKEY='wrkman.core.memory.v1';
var JKEY='wrkman.core.journal.v1';
var CONCEPTKEY='wrkman.core.concepts.v1';
var READKEY='wrkman.core.reading.v1';
var VOCABKEY='wrkman.core.vocabulary.v1';
var MAXJ=200;
var observations=[];
var brainBus=new WRKMANBrain.BrainBus().register(WRKMANBrain.none).register(WRKMANBrain.firstWords);
brainBus.use('first-words');
var log=document.getElementById('log');
var input=document.getElementById('in');
var identity={
  name:'WRKMAN',
  version:'0.9.0',
  born:'2026-10-01',
  model:null,
  hardRules:['Unknown stays unknown.','Do not claim an action happened unless it happened.','Read before assuming.'],
  capabilities:[
    'Report exactly what I can and cannot do.',
    'Remember text in this browser across ordinary restarts.',
    'Recall and remove those local memories.',
    'Inspect the live WRKMAN GitHub repository.',
    'Read UTF-8 text files from the repository.',
    'Keep a local journal of boots, commands, reads, and memory changes.',
    'Keep an ordered local Reading Bench of web sources, notes, and extracted page text when browser access permits.'
  ]
};

function now(){return new Date().toISOString()}
function safeParse(s,fallback){try{return JSON.parse(s)}catch(e){return fallback}}
function loadMem(){return safeParse(localStorage.getItem(MEMKEY)||'[]',[])}
function saveMem(v){localStorage.setItem(MEMKEY,JSON.stringify(v))}
function loadJournal(){return safeParse(localStorage.getItem(JKEY)||'[]',[])}
function loadReading(){return safeParse(localStorage.getItem(READKEY)||'[]',[])}
function saveReading(v){localStorage.setItem(READKEY,JSON.stringify(v))}
function loadVocab(){return safeParse(localStorage.getItem(VOCABKEY)||'[]',[])}
function saveVocab(v){localStorage.setItem(VOCABKEY,JSON.stringify(v))}
function loadConcepts(){return safeParse(localStorage.getItem(CONCEPTKEY)||'[]',[])}
function saveConcepts(v){localStorage.setItem(CONCEPTKEY,JSON.stringify(v))}
function journal(type,detail){
  var j=loadJournal();
  j.push({at:now(),type:type,detail:String(detail||'')});
  if(j.length>MAXJ)j=j.slice(-MAXJ);
  localStorage.setItem(JKEY,JSON.stringify(j));
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function appendLinkedText(parent,text){
  var re=/https?:\/\/[^\s<>"']+/gi,last=0,match;
  while((match=re.exec(String(text)))!==null){
    if(match.index>last)parent.appendChild(document.createTextNode(String(text).slice(last,match.index)));
    var raw=match[0],trail='';
    while(/[.,!?;:]$/.test(raw)){trail=raw.slice(-1)+trail;raw=raw.slice(0,-1)}
    try{
      var u=new URL(raw);
      if(u.protocol==='http:'||u.protocol==='https:'){
        var a=document.createElement('a');
        a.href=u.href;a.textContent=raw;a.target='_blank';a.rel='noopener noreferrer';
        parent.appendChild(a);
      }else parent.appendChild(document.createTextNode(raw));
    }catch(e){parent.appendChild(document.createTextNode(raw))}
    if(trail)parent.appendChild(document.createTextNode(trail));
    last=match.index+match[0].length;
  }
  if(last<String(text).length)parent.appendChild(document.createTextNode(String(text).slice(last)));
}
function say(kind,text){
  var row=document.createElement('div');
  row.className='row '+kind;
  var label=kind==='me'?'YOU':kind==='wrk'?'WRKMAN':kind==='bad'?'FAULT':'SYSTEM';
  var tag=document.createElement('span');
  tag.className='tag';tag.textContent=label;
  row.appendChild(tag);
  appendLinkedText(row,text);
  log.appendChild(row);
  log.scrollTop=log.scrollHeight;
}
function base64ToUtf8(b64){
  var bin=atob(b64.replace(/\n/g,''));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
async function api(path){
  var r=await fetch(API+path,{headers:{'Accept':'application/vnd.github+json'}});
  if(!r.ok)throw new Error('GitHub returned '+r.status);
  return r.json();
}
async function loadIdentity(){
  try{
    var f=await api('/contents/core/identity.json?ref='+encodeURIComponent(BRANCH));
    var remote=JSON.parse(base64ToUtf8(f.content));
    identity=remote;
    journal('identity','Loaded core/identity.json from repository.');
  }catch(e){
    journal('identity-fallback',e.message);
  }
}
function brainPacket(message){
  return {protocol:WRKMANBrain.protocol,message:message,identity:identity,memories:loadMem(),concepts:loadConcepts(),observations:observations.slice(-12),recentJournal:loadJournal().slice(-20)};
}
async function askBrain(message){
  try{
    var out=await brainBus.think(brainPacket(message));
    journal('brain',out.brain+' '+out.confidence);
    say('wrk',out.text);
  }catch(e){journal('brain-fault',e.message);say('bad','Brain fault: '+e.message)}
}
function brainStatus(){
  var b=brainBus.current();
  say('wrk','Brain protocol: '+WRKMANBrain.protocol+'\nActive adapter: '+(b?b.id:'NONE')+'\n\nBrains are replaceable components. Identity, memory, tools, and truth rules belong to WRKMAN.');
}
function capabilities(){
  var lines=['I currently know how to:'];
  identity.capabilities.forEach(function(x,i){lines.push((i+1)+'. '+x)});
  lines.push('');
  lines.push('My First Words brain can handle greetings, simple identity questions, and memory-grounded recall. I still have no general language model or outside knowledge.');
  say('wrk',lines.join('\n'));
}
function status(){
  var mem=loadMem(),j=loadJournal();
  say('wrk',[
    'Name: '+identity.name,
    'Version: '+identity.version,
    'Brain: '+(brainBus.current()?brainBus.current().id:'NONE'),
    'General model: '+(identity.model||'NONE'),
    'Memory: '+mem.length+' local item'+(mem.length===1?'':'s'),
    'Concepts: '+loadConcepts().length+' local lesson'+(loadConcepts().length===1?'':'s'),
    'Journal: '+j.length+' local event'+(j.length===1?'':'s'),
    'Repository: '+OWNER+'/'+REPO+' @ '+BRANCH+' (read-only)',
    'Rule: '+identity.hardRules[0]
  ].join('\n'));
}
function memories(){
  var m=loadMem();
  if(!m.length){say('wrk','I have no stored memories yet. Use: remember <something>');return}
  say('wrk',m.map(function(x){return '#'+x.id+'  '+x.text+'\n    '+x.at}).join('\n\n'));
}
function concepts(){
  var c=loadConcepts();
  if(!c.length){say('wrk','My Concept Book is empty. Teach me with: teach <term> means <term>');return}
  say('wrk',c.map(function(x){return '#'+x.id+'  '+x.terms.join(' = ')+'\n    taught '+x.at}).join('\n\n'));
}
function teach(text){
  var parts=text.split(/\s+means\s+/i).map(function(x){return x.trim()}).filter(Boolean);
  if(parts.length!==2){say('wrk','Teach me one relationship at a time: teach <term> means <term>');return}
  var c=loadConcepts(),id=c.reduce(function(n,x){return Math.max(n,x.id||0)},0)+1;
  c.push({id:id,terms:[parts[0],parts[1]],at:now()});
  saveConcepts(c);journal('concept-teach','#'+id);
  say('wrk','Learned concept #'+id+': '+parts[0]+' = '+parts[1]+'.');
}
function unteach(term){
  term=term.trim().replace(/^#/,'');
  var c=loadConcepts(),next;
  if(/^\d+$/.test(term))next=c.filter(function(x){return x.id!==Number(term)});
  else next=c.filter(function(x){return !x.terms.some(function(t){return t.toLowerCase()===term.toLowerCase()})});
  if(next.length===c.length){say('wrk','I could not find that concept.');return}
  saveConcepts(next);journal('concept-unteach',term);say('wrk','Removed that concept lesson.');
}
function remember(text){
  text=text.trim();
  if(!text){say('wrk','I need something after "remember".');return}
  var m=loadMem();
  var id=m.reduce(function(n,x){return Math.max(n,x.id||0)},0)+1;
  m.push({id:id,text:text,at:now()});
  saveMem(m);
  journal('memory-write','#'+id+' '+text);
  say('wrk','Stored locally as memory #'+id+'. I can recall it after an ordinary page or browser restart on this device.');
}
function forget(id){
  var m=loadMem(),n=Number(id),next=m.filter(function(x){return x.id!==n});
  if(next.length===m.length){say('wrk','I do not have memory #'+id+'.');return}
  saveMem(next);journal('memory-delete','#'+id);say('wrk','Removed local memory #'+id+'.');
}
async function inspect(){
  say('sys','Reading repository root…');
  try{
    var root=await api('/contents?ref='+encodeURIComponent(BRANCH));
    var names=root.map(function(x){return (x.type==='dir'?'[dir] ':'[file] ')+x.path});
    journal('repo-inspect',names.length+' root entries');
    say('wrk','I can see '+names.length+' root entries in my live repository:\n\n'+names.join('\n')+'\n\nI can read a text file with: read <path>');
  }catch(e){journal('repo-fault',e.message);say('bad','I could not inspect the repository: '+e.message)}
}
async function readFile(path){
  path=path.trim().replace(/^\/+/,'');
  if(!path||path.indexOf('..')!==-1){say('wrk','Give me a repository-relative path without "..".');return}
  say('sys','Reading '+path+'…');
  try{
    var f=await api('/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(BRANCH));
    if(Array.isArray(f)){say('wrk',path+' is a directory. Use "inspect" for the root for now.');return}
    if(!f.content){say('wrk','I found '+path+', but I cannot decode it as a normal text file.');return}
    var text=base64ToUtf8(f.content);
    journal('repo-read',path+' '+text.length+' chars');
    var limit=6500;
    var tail=text.length>limit?'\n\n[Stopped after '+limit+' characters. I know the file is longer.]':'';
    say('wrk','FILE '+path+'\n\n'+text.slice(0,limit)+tail);
  }catch(e){journal('repo-fault',path+' '+e.message);say('bad','I could not read '+path+': '+e.message)}
}
function cleanPageText(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  Array.prototype.forEach.call(doc.querySelectorAll('script,style,noscript,svg,nav,footer,header,form,aside'),function(n){n.remove()});
  var root=doc.querySelector('article,main,[role="main"]')||doc.body;
  return String(root?root.innerText:'').replace(/\n{3,}/g,'\n\n').replace(/[ \t]+/g,' ').trim();
}
function tokenizeReading(text){
  var hits={},re=/[A-Za-z][A-Za-z0-9'-]*/g,m;
  while((m=re.exec(String(text||'')))!==null){
    var display=m[0],key=display.toLowerCase().replace(/^['-]+|['-]+$/g,'');
    if(key.length<2)continue;
    if(!hits[key])hits[key]={word:key,count:0};
    hits[key].count++;
  }
  return Object.keys(hits).map(function(k){return hits[k]}).sort(function(a,b){return b.count-a.count||a.word.localeCompare(b.word)});
}
function ensureCandidates(item){
  if(!Array.isArray(item.candidates))item.candidates=[];
  if(!Array.isArray(item.rejectedCandidates))item.rejectedCandidates=[];
}
function scanWords(id){
  var r=loadReading(),item=r.find(function(x){return x.id===Number(id)});
  if(!item){say('wrk','I do not have Reading Bench source #'+id+'.');return}
  if(!item.text){say('wrk','Source #'+id+' has no captured text for me to scan. Read it first.');return}
  ensureCandidates(item);
  var rejected={};item.rejectedCandidates.forEach(function(w){rejected[w]=1});
  var approved={};loadVocab().forEach(function(v){approved[v.word]=1});
  item.candidates=tokenizeReading(item.text).filter(function(x){return !rejected[x.word]&&!approved[x.word]});
  item.scannedAt=now();saveReading(r);journal('vocab-scan','#'+id+' '+item.candidates.length+' candidates');
  say('wrk','Scanned source #'+id+'.\nPotential vocabulary: '+item.candidates.length+' unique words.\n\nI counted strings only. I did not infer what any word means.\nUse: words '+id);
}
function showWords(id){
  var r=loadReading(),item=r.find(function(x){return x.id===Number(id)});
  if(!item){say('wrk','I do not have Reading Bench source #'+id+'.');return}
  ensureCandidates(item);
  if(!item.candidates.length){say('wrk','Source #'+id+' has no potential vocabulary list yet. Use: scan '+id);return}
  var shown=item.candidates.slice(0,120);
  say('wrk','POTENTIAL VOCABULARY · SOURCE #'+id+'\n'+shown.map(function(x){return x.word+'  ×'+x.count}).join('\n')+(item.candidates.length>shown.length?'\n\n['+(item.candidates.length-shown.length)+' more candidates not shown]':''));
}
function rejectWord(id,word){
  word=String(word||'').toLowerCase().trim();var r=loadReading(),item=r.find(function(x){return x.id===Number(id)});
  if(!item){say('wrk','I do not have Reading Bench source #'+id+'.');return}
  ensureCandidates(item);var before=item.candidates.length;
  item.candidates=item.candidates.filter(function(x){return x.word!==word});
  if(before===item.candidates.length){say('wrk','I could not find "'+word+'" in source #'+id+' potential vocabulary.');return}
  if(item.rejectedCandidates.indexOf(word)===-1)item.rejectedCandidates.push(word);
  saveReading(r);journal('vocab-reject','#'+id+' '+word);say('wrk','Removed "'+word+'" from source #'+id+' potential vocabulary. It was not added to my vocabulary.');
}
function admitWord(id,word){
  word=String(word||'').toLowerCase().trim();var r=loadReading(),item=r.find(function(x){return x.id===Number(id)});
  if(!item){say('wrk','I do not have Reading Bench source #'+id+'.');return}
  ensureCandidates(item);var hit=item.candidates.find(function(x){return x.word===word});
  if(!hit){say('wrk','I could not find "'+word+'" in source #'+id+' potential vocabulary.');return}
  var v=loadVocab(),existing=v.find(function(x){return x.word===word});
  if(existing){if(existing.sources.indexOf(Number(id))===-1)existing.sources.push(Number(id));existing.occurrences+=hit.count}
  else v.push({word:word,admittedAt:now(),sources:[Number(id)],occurrences:hit.count});
  saveVocab(v);
  r.forEach(function(src){ensureCandidates(src);src.candidates=src.candidates.filter(function(x){return x.word!==word})});
  saveReading(r);journal('vocab-admit',word+' from #'+id);say('wrk','Admitted "'+word+'" to my vocabulary from source #'+id+'.\nI know I have encountered this word. I still do not claim to know what it means.');
}
function vocabulary(){
  var v=loadVocab().slice().sort(function(a,b){return a.word.localeCompare(b.word)});
  if(!v.length){say('wrk','My active vocabulary is empty. Potential words remain partitioned by source until you admit them.');return}
  say('wrk','ACTIVE VOCABULARY\n'+v.map(function(x){return x.word+' · seen '+x.occurrences+'× · source'+(x.sources.length===1?' ':'s ')+x.sources.map(function(n){return '#'+n}).join(', ')}).join('\n'));
}
function readingBench(){
  var r=loadReading();
  if(!r.length){say('wrk','My Reading Bench is empty. Use: bench add <url>');return}
  say('wrk',r.map(function(x,i){return (i+1)+'. #'+x.id+'  '+(x.title||x.url)+'\n    '+x.status+' · '+x.url+(x.note?'\n    note: '+x.note:'')}).join('\n\n'));
}
async function benchAdd(raw){
  raw=raw.trim();var url;
  try{url=new URL(raw);if(url.protocol!=='http:'&&url.protocol!=='https:')throw new Error('protocol')}catch(e){say('wrk','Give me a full HTTP or HTTPS page link.');return}
  var r=loadReading(),id=r.reduce(function(n,x){return Math.max(n,x.id||0)},0)+1;
  var item={id:id,url:url.href,title:'',status:'saved · unread',text:'',addedAt:now(),readAt:null,note:''};
  r.push(item);saveReading(r);journal('bench-add','#'+id+' '+url.href);
  say('wrk','Added source #'+id+' to the end of my Reading Bench.\n'+url.href+'\n\nTrying to read it now…');
  await benchRead(id);
}
async function benchRead(id){
  var r=loadReading(),item=r.find(function(x){return x.id===Number(id)});
  if(!item){say('wrk','I do not have Reading Bench source #'+id+'.');return}
  try{
    var res=await fetch(item.url,{headers:{'Accept':'text/html,text/plain'}});
    if(!res.ok)throw new Error('HTTP '+res.status);
    var html=await res.text(),text=cleanPageText(html);
    if(text.length<120)throw new Error('No substantial readable text returned.');
    var doc=new DOMParser().parseFromString(html,'text/html');
    item.title=(doc.querySelector('title')||{}).textContent||item.url;
    item.title=item.title.trim().slice(0,180);item.text=text.slice(0,120000);item.status='read · '+item.text.length+' chars';item.readAt=now();
    saveReading(r);journal('bench-read','#'+item.id+' '+item.text.length+' chars');
    say('wrk','Read source #'+item.id+'.\nTitle: '+item.title+'\nCaptured: '+item.text.length+' characters.\n\nThe page text is stored locally with its source. I do not have a semantic summarizer yet.');
  }catch(browserError){
    say('sys','Browser read blocked. Trying my server reader…');
    try{
      var rr=await fetch(READER+'/read?url='+encodeURIComponent(item.url));
      var data=await rr.json();
      if(!rr.ok||!data.ok)throw new Error(data.error||('Reader returned '+rr.status));
      item.title=(data.title||item.url).trim().slice(0,180);item.text=String(data.text||'').slice(0,120000);item.status='read via server · '+item.text.length+' chars';item.readAt=now();
      saveReading(r);journal('bench-read-server','#'+item.id+' '+item.text.length+' chars');
      say('wrk','Read source #'+item.id+' through my server reader.\nTitle: '+item.title+'\nCaptured: '+item.text.length+' characters.\n\nThe page text is stored locally with its source. I do not have a semantic summarizer yet.');
    }catch(serverError){
      item.status='blocked · '+serverError.message;saveReading(r);journal('bench-blocked','#'+item.id+' browser: '+browserError.message+' server: '+serverError.message);
      say('wrk','I saved source #'+item.id+', but both reading paths failed.\nBrowser: '+browserError.message+'\nServer reader: '+serverError.message+'\n\nI will not claim I read blocked content.');
    }
  }
}
function benchMove(id,pos){
  var r=loadReading(),i=r.findIndex(function(x){return x.id===Number(id)}),p=Math.max(1,Math.min(r.length,Number(pos)))-1;
  if(i<0||!Number.isFinite(p)){say('wrk','Use: bench move <source number> <position>');return}
  var x=r.splice(i,1)[0];r.splice(p,0,x);saveReading(r);journal('bench-move','#'+id+' to '+(p+1));say('wrk','Moved source #'+id+' to Reading Bench position '+(p+1)+'.');
}
function benchNote(id,note){
  var r=loadReading(),x=r.find(function(v){return v.id===Number(id)});
  if(!x){say('wrk','I do not have Reading Bench source #'+id+'.');return}
  x.note=note.trim();saveReading(r);journal('bench-note','#'+id);say('wrk','Attached your note to source #'+id+'.');
}
function benchRemove(id){
  var r=loadReading(),n=r.filter(function(x){return x.id!==Number(id)});
  if(n.length===r.length){say('wrk','I do not have Reading Bench source #'+id+'.');return}
  saveReading(n);journal('bench-remove','#'+id);say('wrk','Removed source #'+id+' from my Reading Bench.');
}
function showJournal(){
  var j=loadJournal().slice(-30);
  if(!j.length){say('wrk','My journal is empty.');return}
  say('wrk',j.map(function(x){return x.at+'  '+x.type+(x.detail?'  '+x.detail:'')}).join('\n'));
}
function help(){
  say('wrk',[
    'Commands I understand:',
    'status',
    'capabilities',
    'inspect',
    'read <repository path>',
    'remember <text>',
    'teach <term> means <term>',
    'concepts',
    'unteach <term or concept number>',
    'memories',
    'forget <memory number>',
    'journal',
    'bench',
    'bench add <page url>',
    'bench read <source number>',
    'bench move <source number> <position>',
    'bench note <source number> <your note>',
    'bench remove <source number>',
    'scan <source number>',
    'words <source number>',
    'reject <source number> <word>',
    'admit <source number> <word>',
    'vocabulary',
    'brain',
    'help',
    '',
    'Plain-language versions of "who are you?" and "what can you do?" also work.'
  ].join('\n'));
}
async function act(raw){
  var q=raw.trim();
  if(!q)return;
  say('me',q);journal('command',q);
  var low=q.toLowerCase();
  if(low==='help'||low==='?')return help();
  if(low==='status'||low==='who are you?'||low==='who are you')return status();
  if(low==='capabilities'||low==='what can you do?'||low==='what can you do'||low==='what do you know how to do?'||low==='what do you know how to do')return capabilities();
  if(low==='inspect'||low==='inspect self'||low==='inspect repository'||low==='read yourself'||low==='read repository')return inspect();
  if(low==='memories'||low==='recall'||low==='what do you remember?'||low==='what do you remember')return memories();
  if(low==='journal')return showJournal();
  if(low==='concepts'||low==='concept book')return concepts();
  if(low==='brain'||low==='brain status')return brainStatus();
  if(low==='vocabulary'||low==='vocab')return vocabulary();
  if(/^scan\s+#?\d+\s*$/i.test(q))return scanWords(q.match(/\d+/)[0]);
  if(/^words\s+#?\d+\s*$/i.test(q))return showWords(q.match(/\d+/)[0]);
  if(/^reject\s+#?\d+\s+[^\s]+\s*$/i.test(q)){var rp=q.match(/^reject\s+#?(\d+)\s+([^\s]+)\s*$/i);return rejectWord(rp[1],rp[2])}
  if(/^admit\s+#?\d+\s+[^\s]+\s*$/i.test(q)){var ap=q.match(/^admit\s+#?(\d+)\s+([^\s]+)\s*$/i);return admitWord(ap[1],ap[2])}
  if(low==='bench'||low==='reading bench'||low==='reading')return readingBench();
  if(/^bench\s+add\s+/i.test(q))return benchAdd(q.replace(/^bench\s+add\s+/i,''));
  if(/^bench\s+read\s+#?\d+\s*$/i.test(q))return benchRead(q.match(/\d+/)[0]);
  if(/^bench\s+move\s+#?\d+\s+\d+\s*$/i.test(q)){var nums=q.match(/\d+/g);return benchMove(nums[0],nums[1])}
  if(/^bench\s+note\s+#?\d+\s+/i.test(q)){var nid=q.match(/\d+/)[0];return benchNote(nid,q.replace(/^bench\s+note\s+#?\d+\s+/i,''))}
  if(/^bench\s+remove\s+#?\d+\s*$/i.test(q))return benchRemove(q.match(/\d+/)[0]);
  if(/^teach\s+/i.test(q))return teach(q.replace(/^teach\s+/i,''));
  if(/^unteach\s+/i.test(q))return unteach(q.replace(/^unteach\s+/i,''));
  if(/^remember\s+/i.test(q))return remember(q.replace(/^remember\s+/i,''));
  if(/^forget\s+#?\d+\s*$/i.test(q))return forget(q.match(/\d+/)[0]);
  if(/^read\s+/i.test(q))return readFile(q.replace(/^read\s+/i,''));
  return askBrain(q);
}

document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();var q=input.value;input.value='';act(q)});
Array.prototype.forEach.call(document.querySelectorAll('[data-cmd]'),function(b){b.addEventListener('click',function(){act(b.getAttribute('data-cmd'))})});

(async function boot(){
  journal('boot','WRKMAN Core page loaded.');
  say('sys','Power applied.');
  await loadIdentity();
  document.getElementById('brain-pill').textContent='BRAIN: '+brainBus.current().id.toUpperCase();
  say('wrk','WRKMAN Core '+identity.version+' online.\nBrain protocol: '+WRKMANBrain.protocol+'\nActive brain: '+brainBus.current().id.toUpperCase()+'\nMemory: local to this browser.\nRepository hands: READ ONLY.\n\nMy brain is now a replaceable component. Type "brain" to inspect it.');
})();
})();
</script>
