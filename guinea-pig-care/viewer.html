<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111511">
<title>Guinea Pig Viewer</title>
<style>
:root{color-scheme:dark;--bg:#111511;--panel:#1a201a;--line:#344034;--text:#f4f7f2;--muted:#a9b3a6;--accent:#92da63;--accent2:#b9f392;--danger:#ed7c73}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% -5%,rgba(146,218,99,.12),transparent 28rem),var(--bg);color:var(--text);font-family:ui-rounded,system-ui,-apple-system,sans-serif}.app{width:min(100%,760px);margin:auto;padding:max(16px,env(safe-area-inset-top)) 15px calc(20px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1,h2,p{margin:0}h1{font-size:clamp(1.45rem,6vw,2rem)}h2{font-size:1rem;margin-bottom:8px}.eyebrow,.fresh{font-size:.7rem;letter-spacing:.11em;color:var(--muted);font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0 18px}.stat{padding:11px 8px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:center}.stat strong{display:block;font-size:1.3rem}.stat span{font-size:.7rem;color:var(--muted)}section{margin-top:16px}.stack{display:grid;gap:8px}.card{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--panel);animation:enter .25s ease both}.card.overdue{border-color:rgba(237,124,115,.7);animation:enter .25s ease both,pulse 2.1s ease-in-out infinite 1s}.icon{font-size:1.5rem;text-align:center}.main strong{display:block}.main small,.meta,.empty{color:var(--muted)}.meta{font-size:.74rem;text-align:right}.empty{padding:12px 3px}.learning{margin-top:15px;padding:10px 11px;border-radius:13px;border:1px solid rgba(146,218,99,.22);background:rgba(146,218,99,.08);color:var(--accent2);animation:enter .3s ease}.open{display:block;margin-top:16px;min-height:48px;line-height:48px;text-align:center;border-radius:14px;background:var(--accent);color:#101510;text-decoration:none;font-weight:850}.pulseDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;animation:dot 1.8s ease-in-out infinite}@keyframes enter{from{opacity:0;transform:translateY(7px)}}@keyframes pulse{50%{background:rgba(237,124,115,.08)}}@keyframes dot{50%{transform:scale(1.7);opacity:.45}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="app"><header><div><p class="eyebrow">FORGE VIEWER // CARE</p><h1>🐹 Guinea Pigs</h1></div><div id="fresh" class="fresh"><span class="pulseDot"></span>connecting</div></header><div id="summary" class="summary"></div><section><h2>NOW</h2><div id="now"></div></section><section><h2>SOON</h2><div id="soon"></div></section><section><h2>STOCK</h2><div id="stock"></div></section><div id="learning" class="learning">Learning household rhythm…</div><a id="open" class="open" href="./index.html">Open Dashboard</a></main>
<script>
(()=>{const API='https://pafopmcvampzgenthhpx.supabase.co',KEY='sb_publishable_Iy0c2fhrzE9yVkGHCU97ZQ_aWZ2tlA6',CAP='forge.guineaPigCare.capability.v1',POLL=30000,$=id=>document.getElementById(id);let care=getCap(),last=null;function getCap(){let p=new URLSearchParams(location.hash.slice(1)),v=p.get('careKey');if(v){localStorage.setItem(CAP,v);history.replaceState(null,'',location.pathname+location.search);return v}return localStorage.getItem(CAP)||''}function headers(){return{apikey:KEY,'x-care-key':care}}function human(iso){let t=+new Date(iso);if(!Number.isFinite(t))return'unknown';let d=t-Date.now(),a=Math.abs(d),h=36e5,day=864e5;if(a<h)return d<0?'just now':'within an hour';let n=a<day?Math.round(a/h)+'h':Math.round(a/day)+'d';return d<0?n+' ago':'in '+n}function state(p){if(p.status!=='predicted'||!p.windowStart)return'learning';let t=+new Date(p.windowStart);if(t<=Date.now())return'now';if(t<=Date.now()+4*864e5)return'soon';return'later'}function card(p,i){let a=document.createElement('article'),over=p.likelyAt&&+new Date(p.likelyAt)<Date.now();a.className='card'+(over?' overdue':'');a.style.animationDelay=i*45+'ms';a.innerHTML='<div class="icon">'+p.icon+'</div><div class="main"><strong>'+p.label+'</strong><small>'+(over?'Prediction passed':'Likely approaching')+' · '+(p.confidence||'low')+' confidence</small></div><div class="meta">'+(p.likelyAt?human(p.likelyAt):'learning')+'<br>'+(p.sampleCount||0)+' obs.</div>';return a}function list(node,rows,empty){node.replaceChildren();if(!rows.length){let d=document.createElement('div');d.className='empty';d.textContent=empty;node.appendChild(d);return}let s=document.createElement('div');s.className='stack';rows.forEach((p,i)=>s.appendChild(card(p,i)));node.appendChild(s)}function render(s){let ps=Array.isArray(s.predictions)?s.predictions:[],now=ps.filter(p=>state(p)==='now').sort((a,b)=>+new Date(a.likelyAt)-+new Date(b.likelyAt)),soon=ps.filter(p=>state(p)==='soon').sort((a,b)=>+new Date(a.likelyAt)-+new Date(b.likelyAt)),stable=ps.filter(p=>p.confidence==='high').length;$('summary').innerHTML='<div class="stat"><strong>'+now.length+'</strong><span>needs now</span></div><div class="stat"><strong>'+soon.length+'</strong><span>coming soon</span></div><div class="stat"><strong>'+(s.observationCount||0)+'</strong><span>observations</span></div>';list($('now'),now,'Nothing predicted due right now.');list($('soon'),soon,'No predicted needs in the next few days.');let st=Array.isArray(s.stock)?s.stock:[],$st=$('stock');$st.replaceChildren();let wrap=document.createElement('div');wrap.className='stack';st.slice(0,5).forEach((x,i)=>{let a=document.createElement('article');a.className='card';a.style.animationDelay=i*35+'ms';a.innerHTML='<div class="icon">📦</div><div class="main"><strong>'+x.supply+'</strong><small>'+(x.message||'Learning stock rhythm.')+'</small></div><div class="meta">'+(x.state||'learning')+'</div>';wrap.appendChild(a)});if(st.length)$st.appendChild(wrap);else $st.innerHTML='<div class="empty">Stock learning has not started yet.</div>';$('learning').textContent=(s.learning?.message||'Learning household rhythm')+' · '+stable+' high-confidence pattern'+(stable===1?'':'s');$('fresh').innerHTML='<span class="pulseDot"></span>updated '+human(s.generatedAt);last=JSON.stringify(s)}async function load(){if(!care){$('fresh').textContent='setup required';$('now').innerHTML='<div class="empty">Open the private viewer setup link once.</div>';return}$('open').href='./index.html#careKey='+encodeURIComponent(care);try{let r=await fetch(API+'/rest/v1/guinea_pig_care_snapshots?select=payload&limit=1',{headers:headers(),cache:'no-store'});if(!r.ok)throw Error(r.status);let rows=await r.json();if(!rows.length){$('fresh').textContent='waiting for first log';$('now').innerHTML='<div class="empty">No snapshot yet. Log the first care event in the dashboard.</div>';return}let raw=JSON.stringify(rows[0].payload||{});if(raw!==last)render(rows[0].payload||{});else $('fresh').innerHTML='<span class="pulseDot"></span>updated '+human(rows[0].payload?.generatedAt)}catch{$('fresh').textContent=navigator.onLine?'sync unavailable':'offline'}}load();setInterval(load,POLL)})();
</script></body></html>
