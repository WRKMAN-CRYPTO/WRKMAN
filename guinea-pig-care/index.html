<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111511">
<title>Guinea Pig Care</title>
<style>
:root{color-scheme:dark;--bg:#111511;--panel:#1a201a;--panel2:#222a22;--line:#344034;--text:#f4f7f2;--muted:#a9b3a6;--accent:#92da63;--accent2:#b9f392;--warn:#eab865;--danger:#ed7c73}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% -5%,rgba(146,218,99,.12),transparent 28rem),var(--bg);color:var(--text);font-family:ui-rounded,system-ui,-apple-system,sans-serif}.app{width:min(100%,760px);margin:auto;padding:max(18px,env(safe-area-inset-top)) 15px calc(28px + env(safe-area-inset-bottom))}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}h1,h2,p{margin:0}h1{font-size:clamp(1.5rem,6vw,2.1rem)}h2{font-size:1.05rem}.eyebrow{font-size:.72rem;letter-spacing:.13em;color:var(--muted);font-weight:800}.pigs{font-size:2rem;animation:bob 3s ease-in-out infinite}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:20px 0 14px}.tab,.action,.preset,.step,.secondary,.primary{border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}.tab{min-height:44px;border-radius:13px;font-weight:850;color:var(--muted);transition:.16s}.tab:active,.action:active,.preset:active,.step:active{transform:scale(.96)}.tab.active{background:var(--accent);border-color:var(--accent);color:#101510}.status{min-height:115px}.stack{display:grid;gap:9px}.card{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:17px;background:var(--panel);animation:enter .25s ease both}.card.overdue{border-color:rgba(237,124,115,.7);animation:enter .25s ease both,pulse 2.1s ease-in-out infinite 1s}.icon{font-size:1.55rem;text-align:center}.main strong{display:block}.main small,.meta,.empty{color:var(--muted)}.meta{font-size:.76rem;text-align:right}.empty{text-align:center;padding:28px 8px}.quick{margin-top:23px}.chip{font-size:.75rem;color:var(--accent2);border:1px solid rgba(146,218,99,.25);background:rgba(146,218,99,.09);border-radius:999px;padding:6px 9px}.chip.bump{animation:bump .3s ease}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:11px}.action{min-height:90px;border-radius:17px;padding:12px;text-align:left;position:relative;overflow:hidden;transition:.14s}.action:after{content:"";position:absolute;left:-20%;right:-20%;bottom:-70%;height:80%;border-radius:50%;background:rgba(146,218,99,.09);transition:.2s}.action:active:after{bottom:-45%}.action .emoji{display:block;font-size:1.45rem;margin-bottom:8px}.action .label{display:block;font-weight:800;line-height:1.12}.action .kind{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.08em;margin-top:4px;text-transform:uppercase}.sheet[hidden],.toast[hidden]{display:none}.sheet{position:fixed;inset:0;z-index:30;display:grid;align-items:end}.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62)}.panel{position:relative;width:min(100%,760px);margin:auto;padding:9px 15px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;background:#1b211b;animation:up .22s cubic-bezier(.2,.8,.2,1)}.handle{width:46px;height:5px;border-radius:99px;background:#526052;margin:0 auto 14px}.close{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:1.4rem}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:18px 0 15px}.preset{min-height:44px;border-radius:12px;font-weight:800}.preset.sel{border-color:var(--accent);color:var(--accent2);background:rgba(146,218,99,.13)}.qty{display:grid;grid-template-columns:62px 1fr 62px;gap:10px;align-items:center}.step{height:62px;border-radius:17px;font-size:2rem}.read{text-align:center}.read strong{display:block;font-size:2.25rem;font-variant-numeric:tabular-nums}.read strong.tick{animation:tick .18s ease}.read span{color:var(--muted)}.fine{display:grid;gap:7px;margin-top:16px;color:var(--muted);font-size:.8rem}.fine input{width:100%;accent-color:var(--accent)}.sheetActions{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;margin-top:18px}.secondary,.primary{min-height:50px;border-radius:14px;font-weight:850}.primary{background:var(--accent);border-color:var(--accent);color:#101510}.toast{position:fixed;left:50%;bottom:calc(17px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;width:min(calc(100% - 30px),470px);padding:12px 14px;border-radius:14px;border:1px solid rgba(146,218,99,.35);background:#202720;text-align:center;font-weight:780;animation:toast .2s ease}.sync{font-size:.7rem;color:var(--muted)}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes enter{from{opacity:0;transform:translateY(7px)}}@keyframes pulse{50%{background:rgba(237,124,115,.08)}}@keyframes bump{50%{transform:scale(1.08)}}@keyframes up{from{transform:translateY(100%)}}@keyframes tick{50%{transform:scale(1.13)}}@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}}
</style>
</head>
<body>
<main class="app">
<header><div><p class="eyebrow">FORGE // CARE</p><h1>Guinea Pig Dashboard</h1><div id="sync" class="sync">starting…</div></div><div class="pigs">🐹🐹</div></header>
<nav class="tabs"><button class="tab active" data-view="now">NOW</button><button class="tab" data-view="soon">SOON</button><button class="tab" data-view="stock">STOCK</button><button class="tab" data-view="history">HISTORY</button></nav>
<section id="status" class="status" aria-live="polite"></section>
<section class="quick"><div class="row"><h2>Quick log</h2><span id="count" class="chip">0 observations</span></div><div id="actions" class="grid"></div></section>
</main>
<div id="sheet" class="sheet" hidden><div class="backdrop" data-close></div><section class="panel" role="dialog" aria-modal="true"><div class="handle"></div><div class="row"><div><p id="sheetKind" class="eyebrow"></p><h2 id="sheetTitle"></h2></div><button id="close" class="close">×</button></div><div id="presets" class="presets"></div><div class="qty"><button id="minus" class="step">−</button><div class="read"><strong id="qval">1</strong><span id="qunit"></span></div><button id="plus" class="step">+</button></div><label class="fine">Fine adjustment<input id="range" type="range"></label><div class="sheetActions"><button id="just" class="secondary">Just log it</button><button id="exact" class="primary">Log exact amount</button></div></section></div>
<div id="toast" class="toast" hidden aria-live="polite"></div>
<script>
(()=>{const API='https://pafopmcvampzgenthhpx.supabase.co',KEY='sb_publishable_Iy0c2fhrzE9yVkGHCU97ZQ_aWZ2tlA6',CAP='forge.guineaPigCare.capability.v1',CACHE='forge.guineaPigCare.events.v2',DECAY=.78;
const types=[['hay_refill','Hay refilled','care','🌾','fraction',.25,.25,1,[.25,.5,.75,1]],['hay_purchase','Hay purchased','purchase','🛍️','bag',1,1,10,[1,2,3,4]],['water_refill','Water refilled / changed','care','💧','bottle',.25,.25,2,[.25,.5,1,2]],['pellets_refill','Pellets refilled','care','🥣','cup',.25,.25,4,[.25,.5,1,2]],['pellets_purchase','Pellets purchased','purchase','🛍️','bag',1,1,10,[1,2,3,4]],['carrots_given','Carrots given','care','🥕','piece',1,1,20,[1,2,3,4]],['carrots_purchase','Carrots purchased','purchase','🛍️','bag',1,1,10,[1,2,3,4]],['blueberries_given','Blueberries given','care','🫐','berry',1,1,40,[2,4,6,8]],['blueberries_purchase','Blueberries purchased','purchase','🛍️','container',1,1,10,[1,2,3,4]],['lettuce_given','Lettuce given','care','🥬','leaf',1,1,20,[1,2,3,4]],['lettuce_purchase','Lettuce purchased','purchase','🛍️','head',1,1,10,[1,2,3,4]],['enclosure_cleaned','Enclosure cleaned','care','🧹',null,null,null,null,null],['bedding_replaced','Paper bedding replaced','care','🛏️','fraction',.25,.25,1,[.25,.5,.75,1]],['bedding_purchase','Paper bedding purchased','purchase','🛍️','bag',1,1,10,[1,2,3,4]]].map(x=>({id:x[0],label:x[1],kind:x[2],icon:x[3],unit:x[4],step:x[5],min:x[6],max:x[7],presets:x[8]}));
let events=load(),view='now',active=null,q=null,timer;const $=id=>document.getElementById(id),el={status:$('status'),actions:$('actions'),count:$('count'),sync:$('sync'),sheet:$('sheet'),sheetKind:$('sheetKind'),sheetTitle:$('sheetTitle'),presets:$('presets'),qval:$('qval'),qunit:$('qunit'),range:$('range'),toast:$('toast')};let care=getCap();
function getCap(){const p=new URLSearchParams(location.hash.slice(1)),v=p.get('careKey');if(v){localStorage.setItem(CAP,v);history.replaceState(null,'',location.pathname+location.search);return v}return localStorage.getItem(CAP)||''}function headers(extra={}){return{apikey:KEY,'x-care-key':care,'Content-Type':'application/json',...extra}}function load(){try{let x=JSON.parse(localStorage.getItem(CACHE)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function save(){localStorage.setItem(CACHE,JSON.stringify(events))}function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}
async function remote(){if(!care)return;let r=await fetch(API+'/rest/v1/guinea_pig_care_events?select=id,event_type,occurred_at,quantity,unit,source,schema_version&order=occurred_at.asc',{headers:headers()});if(!r.ok)throw Error(r.status);let rows=await r.json(),rem=rows.map(x=>({id:x.id,type:x.event_type,occurredAt:x.occurred_at,quantity:x.quantity==null?null:Number(x.quantity),unit:x.unit,source:x.source,schemaVersion:x.schema_version,syncState:'synced'})),pending=events.filter(e=>e.syncState==='pending'&&!rem.some(r=>r.id===e.id));events=[...rem,...pending].sort((a,b)=>new Date(a.occurredAt)-new Date(b.occurredAt));save()}
async function push(e){let r=await fetch(API+'/rest/v1/guinea_pig_care_events',{method:'POST',headers:headers({Prefer:'return=minimal'}),body:JSON.stringify({id:e.id,household_key:care,event_type:e.type,occurred_at:e.occurredAt,quantity:e.quantity,unit:e.unit,source:e.source,schema_version:e.schemaVersion})});if(!r.ok&&r.status!==409)throw Error(r.status);e.syncState='synced';save()}
function pred(id){let t=events.filter(e=>e.type===id).map(e=>+new Date(e.occurredAt)).filter(Number.isFinite).sort((a,b)=>a-b);if(t.length<2)return{status:'learning',samples:t.length,message:'Not enough history yet.'};let ints=t.slice(1).map((v,i)=>v-t[i]),ws=0,sum=0;ints.forEach((v,i)=>{let w=DECAY**(ints.length-1-i);ws+=w;sum+=v*w});let mean=sum/ws,vsum=0;ints.forEach((v,i)=>{let w=DECAY**(ints.length-1-i);vsum+=w*(v-mean)**2});let sd=Math.sqrt(vsum/ws),cv=mean?sd/mean:1,next=t.at(-1)+mean,sample=Math.min(1,ints.length/8),cons=Math.max(0,Math.min(1,1-cv)),score=sample*.55+cons*.45,conf=score>=.72?'high':score>=.42?'medium':'low',half=Math.max(sd,mean*.12);return{status:'predicted',samples:t.length,next,windowStart:next-half,windowEnd:next+half,confidence:conf}}
function snapshot(){let predictions=types.map(t=>{let p=pred(t.id);return{eventType:t.id,label:t.label,icon:t.icon,kind:t.kind,status:p.status,sampleCount:p.samples,confidence:p.confidence||null,likelyAt:p.next?new Date(p.next).toISOString():null,windowStart:p.windowStart?new Date(p.windowStart).toISOString():null,windowEnd:p.windowEnd?new Date(p.windowEnd).toISOString():null,message:p.message||null}}),stable=predictions.filter(p=>p.confidence==='high').length,learning=predictions.filter(p=>p.status==='learning').length;return{schemaVersion:2,generatedAt:new Date().toISOString(),observationCount:events.length,predictions,stock:types.filter(t=>t.kind==='purchase').map(t=>({supply:t.id.replace('_purchase',''),state:'learning',message:'Stock estimate awaits enough quantity history.'})),learning:{message:stable>=4?'Stable rhythms emerging':events.length>=6?'Patterns forming':'Learning household rhythm',stableEventTypes:stable,learningEventTypes:learning}}}
async function publish(){if(!care||!navigator.onLine)return;let s=snapshot(),r=await fetch(API+'/rest/v1/guinea_pig_care_snapshots?on_conflict=household_key',{method:'POST',headers:headers({Prefer:'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({household_key:care,schema_version:s.schemaVersion,generated_at:s.generatedAt,observation_count:s.observationCount,payload:s})});if(!r.ok)throw Error(r.status)}
async function log(t,quantity=null){if(!care)return toast('Private care key not configured');let e={id:uuid(),type:t.id,occurredAt:new Date().toISOString(),quantity:quantity==null?null:Number(quantity),unit:quantity==null?null:t.unit,source:'dashboard',schemaVersion:1,syncState:'pending'};events.push(e);save();render(true);toast(t.icon+' '+t.label+' logged');try{await push(e);await publish();el.sync.textContent='synced';render()}catch{el.sync.textContent='saved offline';toast(t.icon+' saved offline · will sync later')}}
function fmt(v,u){if(u==='fraction')return new Map([[.25,'¼'],[.5,'½'],[.75,'¾'],[1,'Full']]).get(v)||v;return Number.isInteger(v)?v:Number(v.toFixed(2))}function plural(u,v){if(u==='fraction')return'capacity';if(u==='berry')return v===1?'berry':'berries';return v===1?u:u+'s'}function human(ms){let d=ms-Date.now(),a=Math.abs(d),h=36e5,day=864e5;if(a<h)return d<0?'just now':'within an hour';let n=a<day?Math.round(a/h)+'h':Math.round(a/day)+'d';return d<0?n+' ago':'in '+n}
function renderActions(){el.actions.replaceChildren();if(!care){el.actions.innerHTML='<div class="empty" style="grid-column:1/-1">Open the private setup link once on this device.</div>';return}types.forEach(t=>{let b=document.createElement('button');b.className='action';b.innerHTML='<span class="emoji">'+t.icon+'</span><span class="label">'+t.label+'</span><span class="kind">'+t.kind+'</span>';b.onclick=()=>t.unit?open(t):log(t);el.actions.appendChild(b)})}
function card(t,p){let a=document.createElement('article');a.className='card '+(p.next<Date.now()?'overdue':'');a.innerHTML='<div class="icon">'+t.icon+'</div><div class="main"><strong>'+t.label+'</strong><small>'+(p.next<Date.now()?'Prediction passed':'Likely approaching')+' · '+p.confidence+' confidence</small></div><div class="meta">'+human(p.next)+'<br>'+p.samples+' obs.</div>';return a}function renderStatus(){if(view==='history')return historyView();if(view==='stock')return stockView();let rows=types.map(t=>({t,p:pred(t.id)})).filter(x=>x.p.status==='predicted').filter(x=>view==='now'?x.p.windowStart<=Date.now():x.p.windowStart>Date.now()&&x.p.windowStart<=Date.now()+4*864e5).sort((a,b)=>a.p.next-b.p.next);if(!rows.length){el.status.innerHTML='<div class="empty">'+(view==='now'?'Nothing predicted due right now.':'No predicted needs in the next few days.')+'</div>';return}let s=document.createElement('div');s.className='stack';rows.forEach(x=>s.appendChild(card(x.t,x.p)));el.status.replaceChildren(s)}
function historyView(){let list=[...events].sort((a,b)=>new Date(b.occurredAt)-new Date(a.occurredAt));if(!list.length){el.status.innerHTML='<div class="empty">No care history yet. The first tap starts the training set.</div>';return}let s=document.createElement('div');s.className='stack';list.slice(0,30).forEach(e=>{let t=types.find(x=>x.id===e.type),a=document.createElement('article'),when=new Date(e.occurredAt),amt=e.quantity==null?'quantity not recorded':fmt(e.quantity,e.unit)+' '+plural(e.unit,e.quantity);a.className='card';a.innerHTML='<div class="icon">'+t.icon+'</div><div class="main"><strong>'+t.label+'</strong><small>'+amt+(e.syncState==='pending'?' · pending sync':'')+'</small></div><div class="meta">'+when.toLocaleDateString()+'<br>'+when.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'</div>';s.appendChild(a)});el.status.replaceChildren(s)}
function stockView(){let s=document.createElement('div');s.className='stack';types.filter(t=>t.kind==='purchase').forEach(t=>{let p=pred(t.id),a=document.createElement('article');a.className='card';a.innerHTML='<div class="icon">📦</div><div class="main"><strong>'+t.label.replace(' purchased','')+'</strong><small>'+(p.status==='learning'?'Not enough purchase history yet.':'Next purchase pattern '+human(p.next)+' · '+p.confidence+' confidence')+'</small></div><div class="meta">stock learning</div>';s.appendChild(a)});el.status.replaceChildren(s)}
function render(bump=false){el.count.textContent=events.length+' observation'+(events.length===1?'':'s');if(bump){el.count.classList.remove('bump');void el.count.offsetWidth;el.count.classList.add('bump')}renderStatus()}function open(t){active=t;q=t.presets?.[1]??t.min;el.sheetKind.textContent=t.kind==='purchase'?'PURCHASE QUANTITY':'CARE QUANTITY';el.sheetTitle.textContent=t.label;el.range.min=t.min;el.range.max=t.max;el.range.step=t.step;el.range.value=q;drawQ();el.sheet.hidden=false}function close(){el.sheet.hidden=true;active=null;q=null}function setQ(v){q=Math.max(active.min,Math.min(active.max,Number((Math.round(Number(v)/active.step)*active.step).toFixed(4))));el.range.value=q;drawQ(true)}function drawQ(tick=false){el.presets.replaceChildren();active.presets.forEach(v=>{let b=document.createElement('button');b.className='preset'+(v===q?' sel':'');b.textContent=fmt(v,active.unit);b.onclick=()=>setQ(v);el.presets.appendChild(b)});el.qval.textContent=fmt(q,active.unit);el.qunit.textContent=plural(active.unit,q);if(tick){el.qval.classList.remove('tick');void el.qval.offsetWidth;el.qval.classList.add('tick')}}function toast(m){clearTimeout(timer);el.toast.textContent=m;el.toast.hidden=false;timer=setTimeout(()=>el.toast.hidden=true,1700)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;renderStatus()});$('minus').onclick=()=>setQ(q-active.step);$('plus').onclick=()=>setQ(q+active.step);el.range.oninput=e=>setQ(+e.target.value);$('exact').onclick=()=>{log(active,q);close()};$('just').onclick=()=>{log(active,null);close()};$('close').onclick=close;document.querySelector('[data-close]').onclick=close;window.addEventListener('online',async()=>{el.sync.textContent='syncing…';for(let e of events.filter(x=>x.syncState==='pending')){try{await push(e)}catch{break}}try{await remote();await publish();el.sync.textContent='synced';render()}catch{el.sync.textContent='sync problem'}});
renderActions();render();(async()=>{if(!care){el.sync.textContent='setup required';return}try{await remote();for(let e of events.filter(x=>x.syncState==='pending'))try{await push(e)}catch{break};await publish();el.sync.textContent='synced';render()}catch{el.sync.textContent=navigator.onLine?'sync unavailable':'offline';render()}})();})();
</script>
</body></html>
