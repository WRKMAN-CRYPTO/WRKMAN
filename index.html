<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070c">
<title>The Constellation</title>
<style>
:root{color-scheme:dark;--bg:#05070c;--text:#f3f6fb;--muted:#9aa5bb;--line:rgba(255,255,255,.12);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;z-index:4;left:0;right:0;top:0;padding:calc(12px + var(--safeT)) 12px 28px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none;background:linear-gradient(#05070cec,#05070c00)}
.titleBlock{min-width:0;flex:1}.k{font-size:9px;letter-spacing:.22em;color:#8f9ab2}.top h1{margin:3px 0 0;font-size:18px;letter-spacing:.08em;white-space:nowrap}.sub{margin-top:5px;font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hud{pointer-events:auto;display:flex;gap:6px;flex:0 0 auto}
button{border:1px solid var(--line);background:#0b101bd6;color:#eef2f9;border-radius:12px;min-width:42px;height:42px;padding:0 11px;font-weight:750}.hud button{min-width:58px}
.council{position:fixed;z-index:3;left:12px;top:calc(82px + var(--safeT));padding:8px 9px;border:1px solid #ffffff12;border-radius:12px;background:#080c15a8;font-size:9px;line-height:1.45;color:#99a5ba;pointer-events:none}.council b{color:#f7f8fb}
.hint{position:fixed;z-index:3;left:50%;bottom:calc(16px + var(--safeB));transform:translateX(-50%);padding:8px 11px;border:1px solid #ffffff14;border-radius:999px;background:#080c16c9;color:#a5afc2;font-size:10px;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.sheet{position:fixed;z-index:5;left:10px;right:10px;bottom:calc(10px + var(--safeB));max-height:57vh;overflow:auto;touch-action:pan-y;overscroll-behavior:contain;border:1px solid #ffffff1e;border-radius:20px;background:linear-gradient(#11182af7,#080c15fa);box-shadow:0 24px 90px #000b;padding:14px;transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none;transition:.25s}.sheet.open{transform:none;opacity:1;pointer-events:auto}
.head{display:flex;justify-content:space-between;gap:10px}.eye{font-size:9px;letter-spacing:.16em;color:#929db3}.sheet h2{font-size:22px;margin:4px 0}.role{font-size:12px;color:#c7cedd}.state{display:inline-block;margin-top:9px;padding:6px 9px;border:1px solid #ffffff18;border-radius:999px;font-size:9px;font-weight:800;letter-spacing:.11em}.facts{display:grid;gap:10px;margin-top:12px}.fact{border-top:1px solid #ffffff12;padding-top:9px}.fact b{display:block;font-size:9px;letter-spacing:.14em;color:#7f8aa1;margin-bottom:4px}.fact p{margin:0;font-size:13px;line-height:1.45;color:#e0e5ef}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;height:40px}.x{height:36px;min-width:36px}
.legend{position:fixed;z-index:3;right:12px;top:calc(82px + var(--safeT));width:112px;padding:9px;border:1px solid #ffffff12;border-radius:13px;background:#080c15a8;color:#9aa6ba;font-size:9px;pointer-events:none}.legend b{display:block;color:#edf1f8;margin-bottom:5px}.lg{display:flex;gap:6px;align-items:center;margin:4px 0}.d{width:7px;height:7px;border-radius:50%}
@media(max-width:430px){.legend{display:none}.council{top:auto;bottom:calc(58px + var(--safeB));opacity:.75}.sheet.open~.council{display:none}.top h1{font-size:16px;letter-spacing:.065em}.k{font-size:8px}.sub{font-size:10px}.hud button{min-width:54px;height:40px;padding:0 9px;font-size:11px}}
@media(min-width:760px){.sheet{left:auto;right:20px;width:390px;bottom:20px}.facts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<canvas id="space" aria-label="Interactive three dimensional map of The Constellation"></canvas>
<div class="top"><div class="titleBlock"><div class="k">SYSTEM ATLAS / PUBLIC V2</div><h1>THE CONSTELLATION</h1><div class="sub" id="sub">Human capability at the center. Explore the orbit.</div></div><div class="hud"><button id="snd">SND</button><button id="home">HOME</button></div></div>
<div class="legend"><b>SIGNAL</b><div class="lg"><i class="d" style="background:#ffd36a"></i>core</div><div class="lg"><i class="d" style="background:#8ad4ff"></i>major star</div><div class="lg"><i class="d" style="background:#d8dceb"></i>planet / skill</div></div>
<div class="hint" id="hint">DRAG TO ORBIT · PINCH TO ZOOM · TAP A STAR</div>
<section class="sheet" id="sheet"><div class="head"><div><div class="eye" id="eye"></div><h2 id="name"></h2><div class="role" id="role"></div></div><button class="x" id="close">×</button></div><div class="state" id="state"></div><div class="facts"><div class="fact"><b>WHAT IT PROVES</b><p id="proves"></p></div><div class="fact"><b>WHAT IT FEEDS</b><p id="feeds"></p></div></div><div class="actions"><button id="focus">FOCUS</button><button id="parent">PARENT</button></div></section>
<div class="council"><b>GAME-CORE</b> leads<br><b>BUILDER-CORE</b> holds veto</div>
<script>
(()=>{'use strict';
const c=document.getElementById('space'),x=c.getContext('2d',{alpha:false}),sheet=document.getElementById('sheet'),hint=document.getElementById('hint'),sub=document.getElementById('sub');
let W,H,D=1,last=0,sel=null,sound=false,focusRoot=null;
const N=[],M={};
function add(n){n.type=n.type||'planet';n.size=n.size||6;n.color=n.color||'#d8dceb';n.state=n.state||'Warm';N.push(n);M[n.id]=n;return n}
add({id:'human',name:'Human Capability',type:'core',role:'Center of Gravity',state:'Core',size:22,color:'#ffd36a',p:[0,0,0],proves:'Every system exists to help a person perceive, understand, decide, learn, recover, or build more effectively.',feeds:'The entire Constellation.'});
add({id:'builder',name:'The Builder',type:'star',role:'North Star Intelligence',state:'North',size:15,color:'#8ad4ff',p:[-180,-120,-70],proves:'AI can be a practical companion for understanding, planning, repair, teaching, and building.',feeds:'Physical-world intelligence, field tools, knowledge preservation.'});
add({id:'wrkman',name:'WRKMAN',type:'star',role:'Anchor Domain',state:'Furnace',size:17,color:'#ffb257',p:[205,85,20],proves:'Practical tools can be simple, satisfying, durable, and useful to people doing physical work.',feeds:'The Builder, field software, construction education.'});
add({id:'ghost',name:'SIGNAL//GHOST',type:'star',role:'Wild Engine',state:'Hot',size:14,color:'#72f1d0',p:[-85,185,95],proves:'Machines can surface patterns in noisy environments while keeping uncertainty and identity visible.',feeds:'Signal language, anomaly detection, credibility rules.'});
add({id:'pandora',name:'Pandora’s Arcade',type:'star',role:'Research Forge',state:'Hot',size:15,color:'#d9a2ff',p:[155,-175,90],proves:'Play can carry learning, mastery, accessibility, and system understanding.',feeds:'Educational games, perceptual design, interaction doctrine.'});
add({id:'attention',name:'Attention Systems',type:'star',role:'Human Systems Lab',state:'Hot',size:13,color:'#ff8fae',p:[-240,65,45],proves:'Software can preserve intention through interruption instead of punishing human inconsistency.',feeds:'Reminder systems, humane workflows, recovery-oriented design.'});
add({id:'skills',name:'Skill Library',type:'star',role:'Core Infrastructure',state:'Infrastructure',size:14,color:'#9de3c3',p:[235,-55,-105],proves:'Judgment can become reusable doctrine instead of being rediscovered every time.',feeds:'Every project and future system.'});
add({id:'audio',name:'Audio / Feedback',type:'star',role:'Support Lab',state:'Lab',size:12,color:'#b8adff',p:[35,235,-85],proves:'Feedback is mechanical information when it carries timing, consequence, state, and cause.',feeds:'Games, tools, mobile interfaces, memory systems.'});
const kids={builder:[['teach','Teach','Knowledge transfer'],['plan','Plan','Reason before action'],['repair','Repair','Understand failure'],['build','Build','Turn intent into reality']],wrkman:[['pipe','Pipe Layout Bench','3D field layout'],['field','Field Tools','Small useful instruments'],['mobile','Mobile Field Doctrine','Phone-first active-field design']],ghost:[['finger','Contract Fingerprinting','Identity before symbol'],['signal','Signal Language','Make judgments legible'],['patterns','Pattern Recognition','Find structure in noise']],pandora:[['vault','VAULT//CHOIR','Tactical laboratory'],['edu','Educational Games','Learning through play'],['percept','Perceptual Experiments','Same truth, different channels']],attention:[['context','Context Recovery','Resume without rebuilding'],['reminder','Reminder Engine','Return intent at the right time'],['interrupt','Interruption Resilience','Partial work survives reality']],skills:[['gamecore','Game-core','Council leader'],['buildercore','Builder-core','Veto authority'],['kiss','KISS Engineering','Complexity warden'],['mobilefield','Mobile Field Tool Design','Field marshal'],['assumption','Assumption Hunting','Truth auditor'],['failure','Failure Mode Review','Risk sentinel'],['recovery','Attention Recovery','Continuity keeper'],['mechanic','Mechanic Design','Choice auditor'],['feedback','Feedback and Feel','Signal conductor'],['equiv','Perceptual Equivalence','Translation arbiter']],audio:[['polish','Audio Polish','Meaning through sound'],['cause','Cause & Effect','Make outcomes attributable'],['weight','Interaction Weight','Make commitment perceptible']]};
const R={builder:48,wrkman:55,ghost:46,pandora:50,attention:44,skills:62,audio:40};
Object.entries(kids).forEach(([pid,a])=>{let p=M[pid],r=R[pid];a.forEach((q,i)=>{let A=i/a.length*Math.PI*2+pid.length*.31;add({id:q[0],name:q[1],parent:pid,type:pid==='skills'?'skill':'planet',role:q[2],state:q[0]==='gamecore'||q[0]==='buildercore'?'Active':'Warm',size:q[0]==='gamecore'?8:q[0]==='buildercore'?7:5.5,color:q[0]==='gamecore'?'#ffe07e':q[0]==='buildercore'?'#ffad78':'#d8deeb',p:[p.p[0]+Math.cos(A)*r,p.p[1]+Math.sin(A)*r*.72,p.p[2]+Math.sin(A+.35)*r*.52],proves:q[0]==='gamecore'?'Exploration must be worth doing. Curiosity needs a meaningful loop.':q[0]==='buildercore'?'Play and novelty never outrank usefulness, dignity, truth, or clarity.':'A small reusable capability can influence larger systems.',feeds:pid==='skills'?'The council and every project review.':p.name})})});
const L=[];N.forEach(n=>n.parent&&L.push([n.parent,n.id]));['builder','wrkman','ghost','pandora','attention','skills','audio'].forEach(i=>L.push(['human',i]));L.push(['skills','builder'],['skills','wrkman'],['skills','ghost'],['skills','pandora'],['audio','pandora'],['attention','builder'],['wrkman','builder']);
const stars=Array.from({length:240},(_,i)=>({x:(Math.sin(i*12.9898)*43758.5453)%1,y:(Math.sin(i*78.233)*13758.1)%1,a:.08+(i%9)*.025,s:.3+(i%4)*.25}));
let cam={yaw:-.45,pitch:.24,zoom:1.25,px:0,py:0};try{Object.assign(cam,JSON.parse(localStorage.getItem('constellation.camera')||'{}'))}catch{}
function save(){try{localStorage.setItem('constellation.camera',JSON.stringify(cam))}catch{}}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function rot(p){let cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),xx=p[0]*cy-p[2]*sy,z=p[0]*sy+p[2]*cy,y=p[1]*cp-z*sp;return[xx,y,p[1]*sp+z*cp]}
function displayWorld(n){if(!focusRoot||!n.parent||n.parent!==focusRoot)return n.p;let par=M[focusRoot],boost=focusRoot==='skills'?1.52:1.22;return[par.p[0]+(n.p[0]-par.p[0])*boost,par.p[1]+(n.p[1]-par.p[1])*boost,par.p[2]+(n.p[2]-par.p[2])*boost]}
function projNode(n){let q=rot(displayWorld(n)),d=720+q[2],f=560*cam.zoom/d;return{x:W/2+cam.px+q[0]*f,y:H/2+cam.py+q[1]*f,z:q[2],f}}
function rgba(h,a){h=h.slice(1);let n=parseInt(h,16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
function glow(px,py,r,col,a=1){let g=x.createRadialGradient(px,py,0,px,py,r*4);g.addColorStop(0,rgba(col,.66*a));g.addColorStop(.2,rgba(col,.24*a));g.addColorStop(1,rgba(col,0));x.fillStyle=g;x.beginPath();x.arc(px,py,r*4,0,7);x.fill()}
function sphere(px,py,r,col,a=1){let g=x.createRadialGradient(px-r*.32,py-r*.38,Math.max(1,r*.08),px,py,r*1.15);g.addColorStop(0,rgba('#ffffff',.35*a));g.addColorStop(.18,rgba(col,1*a));g.addColorStop(1,rgba(col,.72*a));x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill()}
function familyOf(n){if(!focusRoot)return true;return n.id===focusRoot||n.parent===focusRoot||(sel&&n===sel)}
function nodeAlpha(n){if(!focusRoot)return sheet.classList.contains('open')&&sel&&n!==sel&&n.parent!==sel.id&&sel.parent!==n.id?.72:1;if(familyOf(n))return 1;return n.type==='core'?.11:n.type==='star'?.16:.06}
function lineAlpha(a,b){if(!focusRoot)return sheet.classList.contains('open')?.45:1;return familyOf(M[a])&&familyOf(M[b])?1:.08}
function governanceMark(n,p,r,a){if(n.id==='gamecore'){x.strokeStyle=`rgba(255,238,166,${.8*a})`;x.lineWidth=1.25;x.beginPath();x.arc(p.x,p.y,r+6,0,7);x.stroke();x.beginPath();x.arc(p.x,p.y,r+10,0,7);x.stroke();x.fillStyle=`rgba(255,238,166,${.9*a})`;for(let i=-1;i<=1;i++){let cx=p.x+i*5,cy=p.y-r-14+(i===0?-3:0);x.beginPath();x.moveTo(cx-2,cy+4);x.lineTo(cx,cy);x.lineTo(cx+2,cy+4);x.fill()}}else if(n.id==='buildercore'){x.strokeStyle=`rgba(255,190,150,${.85*a})`;x.lineWidth=1.3;x.beginPath();x.arc(p.x,p.y,r+7,.2,Math.PI-.2);x.arc(p.x,p.y,r+7,Math.PI+.2,Math.PI*2-.2);x.stroke();x.beginPath();x.moveTo(p.x,p.y+r+10);x.lineTo(p.x-4,p.y+r+5);x.lineTo(p.x+4,p.y+r+5);x.closePath();x.stroke()}}
function boxesOverlap(a,b){return!(a.r<b.l||a.l>b.r||a.b<b.t||a.t>b.b)}
function labelCandidate(n,p,r){let pr=0;if(sel===n)pr=100;else if(focusRoot&&n.id===focusRoot)pr=95;else if(focusRoot&&n.parent===focusRoot)pr=n.id==='gamecore'?92:n.id==='buildercore'?90:80;else if(n.type==='core')pr=58;else if(n.type==='star')pr=48;else return null;if(focusRoot&&!familyOf(n)&&sel!==n)pr-=45;if(pr<=0)return null;let size=n.type==='core'?12:n.type==='star'?10:focusRoot?10:9,weight=n.type==='core'||sel===n?700:600,align='center',tx=p.x,ty=p.y+r+6,baseline='top';if(focusRoot&&n.parent===focusRoot){let pp=projNode(M[focusRoot]),dx=p.x-pp.x,dy=p.y-pp.y,len=Math.max(1,Math.hypot(dx,dy)),ux=dx/len,uy=dy/len;tx=p.x+ux*(r+12);ty=p.y+uy*(r+12);align=ux>.24?'left':ux<-.24?'right':'center';baseline=Math.abs(uy)>.72?(uy<0?'bottom':'top'):'middle'}x.font=`${weight} ${size}px system-ui`;let w=x.measureText(n.name).width,h=size+3;let l=align==='left'?tx:align==='right'?tx-w:tx-w/2;let t=baseline==='top'?ty:baseline==='bottom'?ty-h:ty-h/2;return{n,p,r,pr,size,weight,align,baseline,tx,ty,box:{l:l-4,r:l+w+4,t:t-3,b:t+h+3}}}
function drawLabels(P,RAD){let cand=[];N.forEach(n=>{let q=labelCandidate(n,P[n.id],RAD[n.id]);if(q)cand.push(q)});cand.sort((a,b)=>b.pr-a.pr||a.p.z-b.p.z);let accepted=[];cand.forEach(q=>{let collide=accepted.some(a=>boxesOverlap(q.box,a.box));if(collide&&q.pr<95)return;accepted.push(q);let alpha=focusRoot&&!familyOf(q.n)?.18:1;x.font=`${q.weight} ${q.size}px system-ui`;x.textAlign=q.align;x.textBaseline=q.baseline;x.lineWidth=3;x.strokeStyle=`rgba(5,7,12,${.78*alpha})`;x.strokeText(q.n.name,q.tx,q.ty);x.fillStyle=q.n===sel?`rgba(255,255,255,${alpha})`:`rgba(228,233,242,${.82*alpha})`;x.fillText(q.n.name,q.tx,q.ty)})}
function draw(t){last=t;x.fillStyle='#05070c';x.fillRect(0,0,W,H);stars.forEach((s,i)=>{x.fillStyle=`rgba(210,222,255,${s.a*(.75+.25*Math.sin(t*.0005+i))})`;x.fillRect(Math.abs(s.x)*W,Math.abs(s.y)*H,s.s,s.s)});let P={},RAD={};N.forEach(n=>P[n.id]=projNode(n));L.forEach(([a,b])=>{let A=P[a],B=P[b],la=lineAlpha(a,b);x.strokeStyle=M[b].parent?`rgba(170,185,215,${.16*la})`:`rgba(170,185,215,${.1*la})`;x.lineWidth=.7;x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke()});Object.keys(kids).forEach(id=>{let p=P[id],rr=R[id]*p.f*(focusRoot===id?(id==='skills'?1.52:1.22):1),a=focusRoot&&id!==focusRoot?.1:1;x.strokeStyle=`rgba(190,202,229,${.07*a})`;x.beginPath();x.ellipse(p.x,p.y,rr,rr*.66,0,0,7);x.stroke()});[...N].sort((a,b)=>P[a.id].z-P[b.id].z).forEach(n=>{let p=P[n.id],r=Math.max(1.8,n.size*p.f*1.65)*(1+.05*Math.sin(t*.0014+n.id.length)),a=nodeAlpha(n);RAD[n.id]=r;if(n.type==='core'||n.type==='star')glow(p.x,p.y,r,n.color,a);if(sel===n){x.strokeStyle=`rgba(255,255,255,${.82*a})`;x.lineWidth=1.2;x.beginPath();x.arc(p.x,p.y,r+8,0,7);x.stroke()}sphere(p.x,p.y,r,n.color,a);governanceMark(n,p,r,a);n.s={x:p.x,y:p.y,r:r+14}});drawLabels(P,RAD);requestAnimationFrame(draw)}requestAnimationFrame(draw);
let ptr=new Map(),g=null,moved=false,start={x:0,y:0};c.onpointerdown=e=>{c.setPointerCapture?.(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;start={x:e.clientX,y:e.clientY};if(ptr.size===1)g={yaw:cam.yaw,pitch:cam.pitch,x:e.clientX,y:e.clientY};else{let[a,b]=[...ptr.values()];g={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.zoom,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,px:cam.px,py:cam.py}}};
c.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>7)moved=true;if(ptr.size===1){let p=[...ptr.values()][0];cam.yaw=g.yaw+(p.x-g.x)*.006;cam.pitch=Math.max(-1.2,Math.min(1.2,g.pitch+(p.y-g.y)*.006))}else{let[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;cam.zoom=Math.max(.55,Math.min(3.3,g.z*d/Math.max(10,g.d)));cam.px=g.px+mx-g.mx;cam.py=g.py+my-g.my}};
c.onpointerup=e=>{ptr.delete(e.pointerId);if(!moved&&!ptr.size)pick(e.clientX,e.clientY);g=null;save()};c.onwheel=e=>{e.preventDefault();cam.zoom=Math.max(.55,Math.min(3.3,cam.zoom*Math.exp(-e.deltaY*.001)));save()};
function pick(px,py){let b=null,d=32;N.forEach(n=>{if(!n.s)return;let q=Math.hypot(px-n.s.x,py-n.s.y);if(q<Math.max(d,n.s.r)&&(!b||q<b.d))b={n,d:q}});b&&select(b.n)}
function select(n){sel=n;document.getElementById('eye').textContent=(n.type==='skill'?'COUNCIL SKILL':n.type.toUpperCase())+(n.parent?' · '+M[n.parent].name:'');document.getElementById('name').textContent=n.name;document.getElementById('role').textContent=n.role;document.getElementById('state').textContent=n.state;document.getElementById('proves').textContent=n.proves;document.getElementById('feeds').textContent=n.feeds;document.getElementById('parent').disabled=!n.parent;sheet.classList.add('open');sub.textContent=n.role;hint.style.opacity=0;feedback(70)}
function close(){sheet.classList.remove('open');sub.textContent=focusRoot?M[focusRoot].role:'Human capability at the center. Explore the orbit.';setTimeout(()=>hint.style.opacity=.8,300)}
document.getElementById('close').onclick=close;document.getElementById('parent').onclick=()=>sel?.parent&&select(M[sel.parent]);
document.getElementById('focus').onclick=()=>{if(!sel)return;let root=sel.type==='star'?sel:sel.parent?M[sel.parent]:sel;focusRoot=root.id;let p=projNode(root);cam.px+=W/2-p.x;cam.py+=H*.31-p.y;cam.zoom=Math.min(root.id==='skills'?3.05:2.8,cam.zoom*(root.id==='skills'?1.58:1.35));sub.textContent=root.role+' · focused system';save();feedback(40)};
document.getElementById('home').onclick=()=>{cam={yaw:-.45,pitch:.24,zoom:1.25,px:0,py:0};sel=null;focusRoot=null;close();save()};
document.getElementById('snd').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'SND✓':'SND';feedback(40)};
function feedback(ms){navigator.vibrate?.(ms);if(!sound)return;try{let A=window.AudioContext||window.webkitAudioContext,a=feedback.a||(feedback.a=new A),o=a.createOscillator(),v=a.createGain();o.frequency.value=sel?.type==='star'?330:520;v.gain.setValueAtTime(.025,a.currentTime);v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.04);o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+.05)}catch{}}
setTimeout(()=>{if(!sel)hint.style.opacity=.58},4500)})();
</script>
</body>
